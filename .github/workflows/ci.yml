name: CI
on:
  pull_request:
  push:
    branches:
    - master
    - ci

jobs:

  test:
    name: Tests
    env:
      RUST_BACKTRACE: 1
      TERM: xterm
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment
        run: |
          cargo --version
          rustc --version
          protoc --version 

      - name: Build
        run: |
          cargo build
          cargo build --manifest-path ./test/rust_grpc/Cargo.toml

      - name: Tests
        shell: bash
        run: |
          cargo test
          cd test
          cargo test --manifest-path ./rust_grpc/Cargo.toml
          ./test_script.sh          

  style:
    name: Fmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment
        run: |
          cargo --version
          cargo fmt -- --version
          cargo clippy -- --version
          protoc --version

      - name: Run rustfmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path ./test/rust_grpc/Cargo.toml -- --check
      - name: Run clippy
        run: |
          cargo clippy --all -- -D warnings
          cargo clippy --all --manifest-path ./test/rust_grpc/Cargo.toml -- -D warnings
